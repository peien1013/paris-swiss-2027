<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}</style>
<title>2027 巴黎瑞士名單</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=Noto+Sans+TC:wght@300;400;500;700&display=swap">
<style>
  /* 版面：首頁＝主視覺（阿爾卑斯山＋鐵塔線稿）→ 找人 → 三團彩色卡 → 待辦；點進一團＝漸層團頭 → 總名單表 → 各班次（登機證＋依票種分卡） */
  :root{
    --bg:#f7f1e8; --bg-2:#efe5d6; --surface:#ffffff; --surface-2:#fbf7f1; --fg:#2f2a26; --muted:#7a6f66; --line:#e8dfd2;
    --alps:#2b5f8e; --alps-soft:#e7eff7; --paris:#9a3450; --paris-soft:#f8e8ed; --self:#857a70; --self-soft:#f0ebe5;
    --gold:#b8934a; --gold-deep:#8d6c2c; --gold-ghost:rgba(184,147,74,.16);
    --t-group:#245d8a; --t-indiv:#a8650a; --t-prem:#5b45a6; --t-biz:#16704f; --t-eco:#0b7d8c; --t-ek:#a8302b;
    --ok:#16704f; --ok-soft:#e3f3ec; --warn:#b42318; --warn-soft:#fdecea;
    --s-group:#e2edf8; --s-indiv:#fdf0d6; --s-prem:#ece7fa; --s-biz:#dff3e8; --s-eco:#dcf3f5; --s-ek:#fde6dc; --s-paris:#f8e5ec; --s-self:#eceef1;
    /* 彩色色帶（白字），兩種主題共用 */
    --g-alps-1:#24557f; --g-alps-2:#5a93c3; --g-paris-1:#8a2c47; --g-paris-2:#cf6f88; --g-self-1:#73685f; --g-self-2:#a99b8e; --g-all-1:#5b4a2e; --g-all-2:#b8934a;
    --shadow:0 1px 0 rgba(255,255,255,.6) inset, 0 12px 36px rgba(60,50,45,.09);
    --tint-1:rgba(90,147,195,.16); --tint-2:rgba(207,111,136,.14); --tint-3:rgba(184,147,74,.16);
    --display:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;
    --body:"Noto Sans TC","Microsoft JhengHei","PingFang TC",system-ui,sans-serif;
    --num:"Inter","Noto Sans TC",sans-serif;
  }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
    --bg:#17161a; --bg-2:#1d1b20; --surface:#232127; --surface-2:#2a282f; --fg:#ece7e1; --muted:#b0a69c; --line:#3a3640;
    --gold:#d9b46a; --gold-deep:#e6c788; --gold-ghost:rgba(217,180,106,.16);
    --shadow:0 12px 36px rgba(0,0,0,.35); --tint-1:rgba(90,147,195,.12); --tint-2:rgba(207,111,136,.10); --tint-3:rgba(217,180,106,.10);
    --alps:#79b2df; --alps-soft:#1d2d3c; --paris:#e48aa1; --paris-soft:#3a2229; --self:#a8aeb8; --self-soft:#2a2e36;
    --t-group:#79b2df; --t-indiv:#e5a64a; --t-prem:#a996ee; --t-biz:#5cc79c; --t-eco:#5ccbd9; --t-ek:#ef8780;
    --ok:#5cc79c; --ok-soft:#1b3329; --warn:#ff8a7e; --warn-soft:#3d1f1c;
    --s-group:#1c2c3c; --s-indiv:#382b15; --s-prem:#2a2541; --s-biz:#183226; --s-eco:#15343a; --s-ek:#3b2419; --s-paris:#3a2229; --s-self:#2a2e36; color-scheme:dark }}
  :root[data-theme="dark"]{
    --bg:#17161a; --bg-2:#1d1b20; --surface:#232127; --surface-2:#2a282f; --fg:#ece7e1; --muted:#b0a69c; --line:#3a3640;
    --gold:#d9b46a; --gold-deep:#e6c788; --gold-ghost:rgba(217,180,106,.16);
    --shadow:0 12px 36px rgba(0,0,0,.35); --tint-1:rgba(90,147,195,.12); --tint-2:rgba(207,111,136,.10); --tint-3:rgba(217,180,106,.10);
    --alps:#79b2df; --alps-soft:#1d2d3c; --paris:#e48aa1; --paris-soft:#3a2229; --self:#a8aeb8; --self-soft:#2a2e36;
    --t-group:#79b2df; --t-indiv:#e5a64a; --t-prem:#a996ee; --t-biz:#5cc79c; --t-eco:#5ccbd9; --t-ek:#ef8780;
    --ok:#5cc79c; --ok-soft:#1b3329; --warn:#ff8a7e; --warn-soft:#3d1f1c;
    --s-group:#1c2c3c; --s-indiv:#382b15; --s-prem:#2a2541; --s-biz:#183226; --s-eco:#15343a; --s-ek:#3b2419; --s-paris:#3a2229; --s-self:#2a2e36; color-scheme:dark }

  *{box-sizing:border-box}
  body{color:var(--fg);font:18px/1.65 var(--body);-webkit-font-smoothing:antialiased;min-height:100%;
    background:
      radial-gradient(50% 40% at 12% 0%, var(--tint-1), transparent 65%),
      radial-gradient(44% 36% at 100% 20%, var(--tint-2), transparent 65%),
      radial-gradient(44% 36% at 50% 100%, var(--tint-3), transparent 65%),
      linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
    background-color:var(--bg);background-attachment:fixed}
  .wrap{max-width:1080px;margin:0 auto;padding-block:28px 72px;
    padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
    display:flex;flex-direction:column;gap:26px}
  h1,h2{font-family:var(--display);text-wrap:balance;margin:0;font-weight:700}
  h1{font-size:32px;line-height:1.25}
  h2{font-size:24px}
  a{color:inherit}
  a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

  /* 主視覺 */
  .hero{text-align:center;padding:18px 8px 0;display:flex;flex-direction:column;align-items:center}
  .event{display:inline-block;padding:6px 20px;border-radius:999px;background:linear-gradient(100deg,var(--g-all-2),#a67a35);color:#fff;font-size:14px;font-weight:700;letter-spacing:.16em;box-shadow:0 6px 18px rgba(141,108,44,.24)}
  .main-title{margin:18px 0 6px;font-size:clamp(42px,8vw,64px);font-weight:300;letter-spacing:.2em;line-height:1.15;padding-left:.2em}
  .main-title .a{font-weight:500;color:var(--alps)} .main-title .p{font-weight:500;color:var(--paris)} .main-title .dot{color:var(--gold)}
  .en-title{font-family:var(--num);font-size:12px;font-weight:600;letter-spacing:.32em;color:var(--muted)}
  .trip-date{display:inline-flex;align-items:center;gap:8px;margin-top:14px;padding:6px 18px;border-radius:999px;background:var(--surface);border:1px solid var(--gold);font-family:var(--num);font-size:15px;font-weight:700;letter-spacing:.06em;color:var(--gold-deep)}
  .skyline{display:block;width:100%;max-width:620px;margin:20px auto 0;overflow:visible}
  .skyline .m{stroke:var(--alps);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  .skyline .m2{stroke:var(--alps);fill:none;stroke-width:1.2;opacity:.45;stroke-linecap:round;stroke-linejoin:round}
  .skyline .t{stroke:var(--paris);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  .skyline .w{stroke:var(--gold);fill:none;stroke-width:1.2;opacity:.6;stroke-linecap:round}
  .skyline .glow{fill:var(--gold);opacity:.16}
  .skyline .pl{fill:var(--gold-deep)}
  @keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(6px,-4px)}}
  @keyframes glowPulse{0%,100%{opacity:.12}50%{opacity:.26}}
  .skyline #plane{animation:drift 6s ease-in-out infinite}
  .skyline .glow{animation:glowPulse 5s ease-in-out infinite}

  /* 首頁：選團 */
  .picker{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  .pick{--g1:var(--g-alps-1);--g2:var(--g-alps-2);--c:var(--alps);display:flex;flex-direction:column;text-decoration:none;background:var(--surface);
    border-radius:22px;overflow:hidden;box-shadow:var(--shadow);transition:transform .25s, box-shadow .25s}
  .pick:hover{transform:translateY(-4px);box-shadow:0 18px 40px rgba(60,50,45,.16)}
  .pick.paris{--g1:var(--g-paris-1);--g2:var(--g-paris-2);--c:var(--paris)} .pick.self{--g1:var(--g-self-1);--g2:var(--g-self-2);--c:var(--self)}
  .pick-top{position:relative;display:flex;justify-content:space-between;align-items:flex-end;gap:10px;padding:20px 22px 18px;color:#fff;background:linear-gradient(135deg,var(--g1),var(--g2));overflow:hidden}
  .pick-top svg{position:absolute;right:-6px;bottom:-4px;width:120px;height:auto;opacity:.18;stroke:#fff;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
  .pick .nm{display:block;font-size:32px;font-weight:700;line-height:1.2;letter-spacing:.08em}
  .pick .sb{display:block;font-size:16px;opacity:.9;letter-spacing:.06em}
  .pick .ct{position:relative;font-family:var(--num);font-size:48px;font-weight:800;line-height:1}
  .pick .ct small{font-family:var(--body);font-size:17px;font-weight:500;margin-left:3px}
  .pick-bot{display:flex;flex-direction:column;gap:10px;padding:14px 22px 18px}
  .pick .dt{font-size:15px;color:var(--muted)}
  .pick .go{align-self:flex-start;color:var(--c);font-weight:700;font-size:17px;border:1.5px solid var(--c);border-radius:999px;padding:3px 16px}
  .pick:hover .go{background:var(--c);color:var(--surface)}
  .allbtn{align-self:center;text-decoration:none;font-weight:700;color:var(--gold-deep);background:var(--surface);border:1.5px solid var(--gold);border-radius:999px;padding:8px 24px;box-shadow:var(--shadow)}
  .allbtn:hover{background:var(--gold-ghost)}

  .todo{background:var(--surface);border-radius:22px;padding:18px 24px;box-shadow:var(--shadow);border-top:4px solid var(--warn)}
  .todo h2{font-size:19px;color:var(--warn);margin-bottom:6px}
  .todo ul{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:2px}

  .search{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .search label{font-weight:700;display:flex;align-items:center;gap:6px;color:var(--gold-deep)}
  .search label svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round}
  .search input{flex:1;min-width:0;max-width:340px;font:inherit;padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
  .search-box{background:var(--surface);border-radius:22px;padding:20px 22px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
  .search-box .search label{font-size:21px;letter-spacing:.1em}
  .search-box .search input{font-size:22px;max-width:460px;padding:10px 18px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface-2)}
  .search-box .search input:focus{border-color:var(--gold);outline:none;box-shadow:0 0 0 4px var(--gold-ghost)}
  .hint{margin:0;color:var(--muted);font-size:15px}
  .results:empty{display:none}
  .person{display:flex;flex-direction:column;gap:12px}
  .person-h{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  .pname{font-family:var(--display);font-size:34px;font-weight:700;line-height:1.2;letter-spacing:.08em}
  .person-h .chip{font-size:18px;padding:1px 12px;background:var(--cs)}
  .ptrip{color:var(--muted);font-size:17px}
  .pick-names{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
  .pick-names button{font:inherit;text-align:left;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;color:var(--fg);cursor:pointer;display:flex;flex-direction:column}
  .pick-names button:hover{border-color:var(--alps)}
  .pick-names b{font-size:20px}
  .pick-names span{font-size:14px;color:var(--muted)}
  .results{display:flex;flex-direction:column;gap:6px}
  .results a{display:flex;gap:12px;flex-wrap:wrap;align-items:baseline;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 14px;text-decoration:none}
  .results a b{font-size:20px}
  .results a span{color:var(--muted);font-size:16px}
  .results p{margin:0;color:var(--muted)}

  /* 團內頁 */
  .back{align-self:flex-start;text-decoration:none;font-weight:700;color:var(--muted);font-size:17px}
  .back:hover{color:var(--fg)}
  .trip-head{--g1:var(--g-alps-1);--g2:var(--g-alps-2);border-radius:22px;padding:22px 26px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;
    color:#fff;background:linear-gradient(135deg,var(--g1),var(--g2));box-shadow:var(--shadow)}
  .trip-head.main{--g1:var(--g-paris-1);--g2:var(--g-paris-2)} .trip-head.self{--g1:var(--g-self-1);--g2:var(--g-self-2)} .trip-head.all{--g1:var(--g-all-1);--g2:var(--g-all-2)}
  .trip-head h1{letter-spacing:.06em}
  .trip-head p{margin:2px 0 0;opacity:.88;font-size:16px}
  .trip-head .count{font-family:var(--num);font-size:30px;font-weight:800}
  .route{display:flex;flex-wrap:wrap;gap:8px;font-size:16px;margin-top:14px;width:100%}
  .stop{display:flex;align-items:flex-start;background:rgba(255,255,255,.16);border-radius:12px;padding:6px 12px}
  .stop b{display:block;font-size:14px;opacity:.85;font-family:var(--num);font-weight:700}
  .stop span{display:block;font-size:14px;opacity:.85}

  .step-h{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;padding-bottom:2px}
  .step-h h2{position:relative;padding-left:14px;letter-spacing:.06em}
  .step-h h2::before{content:"";position:absolute;left:0;top:.2em;bottom:.2em;width:5px;border-radius:3px;background:var(--gold)}
  .step-h .note{font-size:16px}
  .tblbox{overflow-x:auto;background:var(--surface);border-radius:18px;box-shadow:var(--shadow)}
  table{border-collapse:collapse;width:100%;min-width:560px;font-size:18px}
  th,td{text-align:left;padding:8px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
  th{font-size:15px;color:var(--muted);font-weight:700;background:var(--surface-2);letter-spacing:.04em}
  tr:last-child td{border-bottom:0}
  td.no{color:var(--muted);font-variant-numeric:tabular-nums;width:3em}
  td.nm{font-size:20px;font-weight:700}
  td .chip{font-size:15px}
  .pill{font-size:14px;border-radius:6px;padding:1px 8px}
  .pill.ok{color:var(--ok);background:var(--ok-soft)}
  .pill.bad{color:var(--warn);background:var(--warn-soft);font-weight:700}
  .pill.plain{color:var(--muted)}
  tbody tr td{background:var(--cs, transparent)}
  tr.flag td:first-child{box-shadow:inset 5px 0 0 var(--warn)}
  tr.flag td.nm{color:var(--warn)}
  .legend{display:flex;flex-wrap:wrap;gap:8px}
  .legend span{background:var(--cs);color:var(--c);border:1.5px solid var(--c);border-radius:8px;padding:2px 12px;font-size:16px;font-weight:700}
  .legend span small{font-weight:400;color:var(--fg);margin-left:4px}

  .carrier{background:var(--surface);border-radius:22px;padding:20px 22px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
  .carrier-h{font-weight:700;font-size:20px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
  .flights{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .fl{background:var(--surface-2);border-radius:10px;padding:10px 14px;font-size:16px;min-width:0}
  .fl h3{margin:0 0 4px;font-size:15px;color:var(--muted);letter-spacing:.06em}
  /* 登機證（沿用日本橫濱／泰國查詢系統的橫式登機證）：左主票面、右票根 */
  .passes{display:flex;flex-direction:column;gap:14px}
  .bp{--acc:var(--alps);position:relative;display:grid;grid-template-columns:1fr 210px;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 2px 12px rgba(40,30,24,.06)}
  .bp.paris{--acc:var(--paris)}
  .bp-main{position:relative;overflow:hidden;min-width:0}
  .bp-bg{position:absolute;top:58%;left:50%;width:300px;transform:translate(-50%,-50%);opacity:.07;color:var(--acc);pointer-events:none}
  .bp-bg svg{display:block;width:100%;height:auto;fill:currentColor}
  .bp-head{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 16px;background:var(--acc);color:var(--surface)}
  .bp-air{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:700;letter-spacing:.04em}
  .bp-air svg{width:15px;height:15px;fill:currentColor}
  .bp-lab{font-size:12px;font-weight:700;letter-spacing:.2em}
  .bp-route{position:relative;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:18px 20px 14px}
  .bp-port{display:flex;flex-direction:column;min-width:0}
  .bp-port.r{align-items:flex-end;text-align:right}
  .bp-code{font-family:var(--num);font-size:50px;font-weight:700;letter-spacing:.03em;line-height:1}
  .bp-v,.bp-stub-route,.bp-air,.bp-lab,.bp-k{font-family:var(--num)}
  .bp-zh{font-size:20px;font-weight:700;margin-top:8px;letter-spacing:.06em}
  .bp-en{font-size:12px;color:var(--muted);letter-spacing:.16em;text-transform:uppercase}
  .bp-mid{display:flex;align-items:center;min-width:80px;color:var(--acc)}
  .bp-mid svg{width:24px;height:24px;fill:currentColor;flex-shrink:0;transform:rotate(90deg)}
  .bp-mid::before,.bp-mid::after{content:"";flex:1;height:2px;margin:0 4px;background:repeating-linear-gradient(90deg,var(--acc) 0 4px,transparent 4px 8px);opacity:.5}
  .bp-info{position:relative;display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line)}
  .bp-cell{padding:8px 12px 10px;border-right:1px solid var(--line);min-width:0}
  .bp-cell:last-child{border-right:0}
  .bp-k{font-size:11px;color:var(--muted);letter-spacing:.14em;line-height:1.3;margin-bottom:4px}
  .bp-v{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2;white-space:nowrap}
  .bp-v.none{font-size:15px;font-weight:400;color:var(--muted)}
  .bp-v small{display:block;font-size:12px;color:var(--warn);font-weight:700}
  .bp-stub{position:relative;padding:10px 14px;display:flex;flex-direction:column;gap:6px;border-left:1.5px dashed var(--line);background:linear-gradient(180deg,var(--surface-2),var(--surface) 70%)}
  .bp-stub::before,.bp-stub::after{content:"";position:absolute;left:-9px;width:16px;height:16px;border-radius:50%;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}
  .bp-stub::before{top:-8px} .bp-stub::after{bottom:-8px}
  .bp-stub-lab{font-size:11px;font-weight:700;letter-spacing:.26em;color:var(--acc);text-align:right;padding-bottom:6px;border-bottom:1px solid var(--line)}
  .bp-stub-route{font-size:28px;font-weight:800;letter-spacing:.02em;line-height:1}
  .bp-stub-route span{color:var(--acc);font-size:18px;margin:0 4px}
  .bp-stub-city{font-size:13px;color:var(--muted)}
  .bp-stub-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .bp-stub-grid .bp-v{font-size:16px}
  .bp-bar{margin-top:auto;opacity:.75}
  .bp-bar svg{display:block;width:100%;height:24px;fill:var(--fg)}
  @media (max-width:760px){
    .bp{grid-template-columns:1fr}
    .bp-stub{display:none}
    .bp-code{font-size:44px}
    .bp-route{padding:18px 16px 14px}
    .bp-info{grid-template-columns:1fr 1fr}
    .bp-cell{border-bottom:1px solid var(--line)}
    .bp-cell:nth-child(2n){border-right:0}
    .bp-cell:nth-child(5){grid-column:1 / -1;border-bottom:0}
  }

  .tix{background:var(--cs);border:1.5px solid var(--c);border-radius:12px;padding:12px 16px}
  .tix .n{background:var(--surface)}
  .tix-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
  .chip{font-size:16px;font-weight:700;color:var(--c);border:1.5px solid var(--c);border-radius:8px;padding:0 10px;white-space:nowrap}
  .count{font-weight:700;font-variant-numeric:tabular-nums}
  .note{color:var(--muted);font-size:15px}
  .warn-note{color:var(--warn);font-size:15px;font-weight:700}
  .t-group{--c:var(--t-group);--cs:var(--s-group)} .t-indiv{--c:var(--t-indiv);--cs:var(--s-indiv)} .t-prem{--c:var(--t-prem);--cs:var(--s-prem)}

  function carrierOf(ticket){ for (var k in CARRIERS) if (CARRIERS[k].tickets.indexOf(ticket) !== -1) return CARRIERS[k]; }
  function pill(p){

  var PLANE = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/></svg>';
  var BG_PLANE = '<svg viewBox="0 0 200 80" aria-hidden="true"><path d="M188 40c0-2-3-3-6-3l-30 1-38-26c-2-1-5-1-7 0l-5 3 22 23-29 1-12-9c-1-1-3-1-4 0l-4 2 9 11-21 1c-2 0-3 1-3 3 0 2 1 3 3 3l21 1-9 11 4 2c1 1 3 1 4 0l12-9 29 1-22 23 5 3c2 1 5 1 7 0l38-26 30 1c3 0 6-1 6-3z"/></svg>';
  var BAR = (function(){ var w = [2,1,3,1,2.5,1,4,1,2,3,1,2,1,3,2,1,4,1,2.5,1,3,2,1,2,3,1,4,1,2,3,1,2.5,1,3,1,2,4,1,3], x = 0, s = '';
    w.forEach(function(v, i){ if (i % 2 === 0) s += '<rect x="' + x + '" y="0" width="' + v + '" height="24"/>'; x += v + 1.2; });
    return '<svg viewBox="0 0 ' + x + ' 24" preserveAspectRatio="none" aria-hidden="true">' + s + '</svg>'; })();
  // 主視覺線稿：左阿爾卑斯山（山頂插瑞士旗）、右艾菲爾鐵塔、飛機沿虛線飛
  var SKYLINE = '<svg class="skyline" viewBox="0 0 640 165" aria-hidden="true">' +

    '<path class="m" d="M10 150 L70 92 L100 116 L160 44 L196 88 L222 70 L300 150"/>' +
    '<path class="m" d="M144 64 L160 44 L176 64 M60 102 L70 92 L80 102"/>' +
    '<path class="m" d="M222 70 V44"/><rect x="222" y="44" width="18" height="13" rx="1.5" fill="#d52b1e"/><path d="M231 47.5 V53.5 M228 50.5 H234" stroke="#fff" stroke-width="2"/>' +
    '<path class="t" d="M472 150 Q489 112 495 70 L501 16 L507 70 Q513 112 530 150"/>' +
    '<path class="t" d="M482 120 L520 120 M489 94 L513 94 M495 70 L507 70 M501 16 V4"/>' +
    '<path class="t" d="M486 150 Q501 128 516 150"/>' +
    '<path class="w" d="M0 150 H640 M40 159 Q60 155 80 159 T120 159 M420 159 Q440 155 460 159 T500 159"/>' +

    '<g id="plane"><g transform="translate(560 30) rotate(75) scale(1.05)"><path class="pl" d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/></g></g>' +

  // 航班字串格式：「高雄 KHH 19:10 → 香港 HKG 20:50（抵達日期）」→ 一張登機證
  function pass(r, c, label, people, trip){
    var m = r[2].match(/^(\S+) (\w{3}) (\d\d:\d\d) → (\S+) (\w{3}) (\d\d:\d\d)(?:（(.+)）)?$/);

    function cell(k, v){ return '<div class="bp-cell"><div class="bp-k">' + k + '</div>' + v + '</div>'; }
    return '<div class="bp' + (trip === 'main' ? ' paris' : '') + '"><div class="bp-main"><div class="bp-bg">' + BG_PLANE + '</div>' +
      '<div class="bp-head"><span class="bp-air">' + PLANE + c.airline + '</span><span class="bp-lab">' + label + '</span></div>' +
      '<div class="bp-route">' +
        '<div class="bp-port"><span class="bp-code">' + m[2] + '</span><span class="bp-zh">' + m[1] + '</span><span class="bp-en">' + (CITY_EN[m[2]] || '') + '</span></div>' +
        '<div class="bp-mid">' + PLANE + '</div>' +
        '<div class="bp-port r"><span class="bp-code">' + m[5] + '</span><span class="bp-zh">' + m[4] + '</span><span class="bp-en">' + (CITY_EN[m[5]] || '') + '</span></div>' +

  // 底色圖例：列出這份名單有的票種與人數

  }
  var app = document.getElementById('app');
  var total = ORDER.reduce(function(s,k){ return s + PEOPLE[k].length; }, 0);

  // ===== 首頁：三團選擇 =====
  function renderHome(){

        '<span class="pick-top">' + ICON[k] + '<span><span class="nm">' + t.name + '</span><span class="sb">' + t.sub + '</span></span>' +

      '<li>國泰、阿聯酋回程的<b>航班號</b>表上沒填</li></ul></section>';

  // ===== 團內頁：總名單 → 各班次 =====
  function renderTrip(k, focus){

    h += '<div class="trip-head ' + k + '"><div><h1>' + t.name + '｜' + t.sub + '</h1><p>' + t.dates + '</p></div><span class="count">' + list.length + ' 人</span>';

      var inC = list.filter(function(p){ return c.tickets.indexOf(p[1]) !== -1; });
      h += '<section class="carrier"><div class="carrier-h">' + c.name + ' <span class="note">' + inC.length + ' 人</span>' + (c.warn ? '<span class="warn-note">' + c.warn + '</span>' : '') + '</div>';
      if (c.backTitle) h += '<div class="note">' + c.backTitle + '</div>';
      if (c.out) h += passes(c, inC.length, k);
      c.tickets.forEach(function(tkKey){
        var ppl = list.filter(function(p){ return p[1] === tkKey; });
        if (!ppl.length) return;
        var tk = TICKETS[tkKey];
        h += '<div class="tix ' + tk.cls + '"><div class="tix-h"><span class="chip">' + tk.label + '</span><span class="count">' + ppl.length + ' 人</span>' +
          (tk.note ? '<span class="note">' + tk.note + '</span>' : '') + (tk.warn ? '<span class="warn-note">' + tk.warn + '</span>' : '') + '</div>' +
          '<div class="names">' + ppl.map(function(p){ return '<div class="n' + (p[3] ? ' flag' : '') + '" data-n="' + p[0] + '">' + p[0] + (p[3] ? pill(p) : '') + '</div>'; }).join('') + '</div></div>';
      });
      h += '</section>';
    });
    h += '<a class="back" href="#">‹ 回到選團</a>';
    app.innerHTML = h;
    if (focus){
      var hits = app.querySelectorAll('[data-n="' + focus.replace(/"/g,'') + '"]');
      Array.prototype.forEach.call(hits, function(el){ el.classList.add('hit'); });
      if (hits[0]) hits[0].scrollIntoView({block:'center'});
    }
  }

  // ===== 全部總名單 =====
  function renderAll(){
    var h = '<a class="back" href="#">‹ 回到選團</a>';
    h += '<div class="trip-head all"><div><h1>全部總名單</h1><p>' + ORDER.map(function(k){ return TRIPS[k].name + ' ' + PEOPLE[k].length; }).join('・') + '，共 ' + total + ' 人</p></div></div>';
    h += legend(ORDER.reduce(function(a,k){ return a.concat(PEOPLE[k]); }, []));
    h += '<div class="tblbox"><table><thead><tr><th>#</th><th>姓名</th><th>團別</th><th>票種</th><th>班次</th><th>狀態</th></tr></thead><tbody>';
    var i = 0;
    ORDER.forEach(function(k){
      PEOPLE[k].forEach(function(p){
        var tk = TICKETS[p[1]];
        h += '<tr class="' + tk.cls + (p[3] ? ' flag' : '') + '"><td class="no">' + (++i) + '</td><td class="nm">' + p[0] + '</td><td><a href="#' + k + '">' + TRIPS[k].name + '</a></td><td><span class="chip ' + tk.cls + '">' + tk.label + '</span></td><td>' + carrierOf(p[1]).short + '</td><td>' + pill(p) + '</td></tr>';
      });
    });
    h += '</tbody></table></div><a class="back" href="#">‹ 回到選團</a>';
    app.innerHTML = h;
  }

  function route(){
    var hash = decodeURIComponent((location.hash || '').replace(/^#/, ''));
    var parts = hash.split('/');
    if (TRIPS[parts[0]]) renderTrip(parts[0], parts[1]);
    else if (parts[0] === 'all') renderAll();
    else renderHome();
    if (!parts[1]) window.scrollTo(0, 0);
  }
  window.addEventListener('hashchange', route);
  route();
})();
</script>

</body>
</html>
